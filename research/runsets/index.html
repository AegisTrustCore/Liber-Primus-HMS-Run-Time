</style></head><body><main><header><div class="eyebrow">HMS ENDEAVOUR · RESEARCH ARCHIVE</div><h1>RUNSETS</h1><p>HMS Research Runsets</p><span class="badge">1 OBJECTS</span></header><section><h2>SEARCH & FILTER</h2><p><input id="q" aria-label="Search" placeholder="ID, title, method, tag…"> <select id="status"><option value="">All statuses</option><option value="STAGED">STAGED</option></select></p></section><div class="grid"><article class="card item" data-status="STAGED" data-search="rset-0001 public verification foundations staged  "><h2><a href="RSET-0001/result.html">RSET-0001</a></h2><h3>Public Verification Foundations</h3><span class="badge">STAGED</span><p>Prove the canonical HMS research-package workflow with a curated, low-disclosure set of already-public executions.</p><a href="RSET-0001/RSET-0001.zip">Download</a></article></div></main><script>const q=document.querySelector('#q'),s=document.querySelector('#status');function f(){document.querySelectorAll('.item').forEach(x=>x.hidden=!(x.dataset.search.includes(q.value.toLowerCase())&&(!s.value||x.dataset.status===s.value)))}q.addEventListener('input',f);s.addEventListener('change',f)</script></body></html>
