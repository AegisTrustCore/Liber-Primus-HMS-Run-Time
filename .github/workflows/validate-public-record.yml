name: Validate public records

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch preserved release-candidate commits
        run: git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pull/*/head'
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate records, releases, posts, and challenges
        run: python scripts/validate_records.py
      - name: Regenerate and verify the Research Archive
        run: |
          python scripts/build_research_archive.py
          git diff --exit-code
      - name: Verify historical OpenPGP artifact
        run: python scripts/verify_cicada_key.py
      - name: Test challenge verifier core
        run: python -m unittest discover -s tests -v
      - name: Test Expedition beginner guidance
        run: python tests/expedition_guidance_checks.py -v
      - name: Reproduce RSET-0002 public ledgers
        run: python scripts/reproduce_rset_0002.py
      - name: Reject local-only public references
        run: python scripts/check_public_boundary.py

  qualify-gp29-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch preserved release-candidate commits
        run: git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pull/*/head'
      - name: Set up pinned Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned build environment
        run: python -m pip install --requirement requirements-build.txt
      - name: Build Windows portable candidate
        shell: pwsh
        run: |
          python scripts/build_gp29_windows.py
          $zip = 'dist/HMS-GP29-v0.1.1-Windows-x64-portable.zip'
          $first = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          python scripts/build_gp29_windows.py
          $second = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          if ($first -ne $second) { throw "Two clean runner builds disagreed: $first != $second" }
          "CI package SHA256: $second"
      - name: Qualify exact packaged executables and checksums
        shell: pwsh
        run: |
          $zip = Resolve-Path 'dist/HMS-GP29-v0.1.1-Windows-x64-portable.zip'
          $qual = Join-Path $env:RUNNER_TEMP 'gp29-qualification'
          Expand-Archive -LiteralPath $zip -DestinationPath $qual
          & (Join-Path $qual 'HMS-GP29-CLI.exe') self-test
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI self-test failed' }
          & (Join-Path $qual 'HMS-GP29-CLI.exe') gp29 'F U/V TH' --mode tokens --job
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Runtime job failed' }
          $gui = Start-Process -FilePath (Join-Path $qual 'HMS-GP29.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($gui.ExitCode -ne 0) { throw 'Packaged GUI self-test failed' }
          Push-Location $qual
          Get-Content SHA256SUMS | ForEach-Object {
            $parts = $_ -split '  ', 2
            $member = (Get-FileHash -LiteralPath $parts[1] -Algorithm SHA256).Hash.ToLower()
            if ($member -ne $parts[0]) { throw "Internal checksum mismatch: $($parts[1])" }
          }
          Pop-Location
      - name: Retain candidate for review only
        uses: actions/upload-artifact@v7
        with:
          name: gp29-windows-ci-qualification-not-for-release
          path: dist/HMS-GP29-v0.1.1-Windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 7

  qualify-expedition-service-container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
      - name: Test sealed service and public client contracts
        run: python -m unittest tests.test_expedition_service -v
      - name: Build non-root service container
        run: docker build --file deploy/expedition-service/Dockerfile --tag hms-expedition-service:qualification .
      - name: Run synthetic self-test inside the exact image
        run: docker run --rm --entrypoint python hms-expedition-service:qualification /app/scripts/serve_expedition_verifier.py --self-test
      - name: Verify configured container user
        run: test "$(docker image inspect hms-expedition-service:qualification --format '{{.Config.User}}')" = "65532:65532"

  qualify-corpus-verifier-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up pinned Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned build environment
        run: python -m pip install --requirement requirements-build.txt
      - name: Build twice and compare within the pinned runner
        shell: pwsh
        run: |
          python scripts/build_corpus_verifier_windows.py
          $zip = 'dist/HMS-Corpus-Verifier-v0.1.0-rc.1-Windows-x64-portable.zip'
          $first = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          python scripts/build_corpus_verifier_windows.py
          $second = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          if ($first -ne $second) { throw "Two clean runner builds disagreed: $first != $second" }
          "CI package SHA256: $second"
      - name: Qualify exact packaged verifier
        shell: pwsh
        run: |
          $zip = Resolve-Path 'dist/HMS-Corpus-Verifier-v0.1.0-rc.1-Windows-x64-portable.zip'
          $qual = Join-Path $env:RUNNER_TEMP 'corpus-verifier-qualification'
          Expand-Archive -LiteralPath $zip -DestinationPath $qual
          $sample = Join-Path $qual 'sample'
          New-Item -ItemType Directory -Path $sample | Out-Null
          [IO.File]::WriteAllText((Join-Path $sample 'page.txt'), "HMS control`n", [Text.UTF8Encoding]::new($false))
          & (Join-Path $qual 'HMS-Corpus-Verifier-CLI.exe') create $sample --corpus-id HMS-CONTROL --version 1 --output (Join-Path $qual 'manifest.json')
          if ($LASTEXITCODE -ne 0) { throw 'Packaged manifest creation failed' }
          & (Join-Path $qual 'HMS-Corpus-Verifier-CLI.exe') verify (Join-Path $qual 'manifest.json') $sample --strict --output (Join-Path $qual 'report.json')
          if ($LASTEXITCODE -ne 0) { throw 'Packaged strict verification failed' }
          $report = Get-Content (Join-Path $qual 'report.json') | ConvertFrom-Json
          if ($report.status -ne 'PASS' -or $report.summary.verified -ne 1) { throw 'Packaged report was not the expected PASS' }
          & (Join-Path $qual 'HMS-Corpus-Verifier-CLI.exe') demo-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Packaged five-case demo self-test failed' }
          $canonicalOutput = Join-Path $env:RUNNER_TEMP 'corpus-canonical-info.json'
          & (Join-Path $qual 'HMS-Corpus-Verifier-CLI.exe') canonical-info | Out-File -LiteralPath $canonicalOutput -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Bundled canonical manifest inspection failed' }
          $canonical = Get-Content $canonicalOutput | ConvertFrom-Json
          if ($canonical.file_count -ne 75 -or $canonical.manifest_sha256 -ne 'd11ef54e113d92cc5fd86976709d0ece188f09c7ce95fcc8d0fdb140c685b009') { throw 'Bundled canonical manifest identity is wrong' }
          $gui = Start-Process -FilePath (Join-Path $qual 'HMS-Corpus-Verifier.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($gui.ExitCode -ne 0) { throw 'Packaged GUI self-test failed' }
          Push-Location $qual
          Get-Content SHA256SUMS | ForEach-Object {
            $parts = $_ -split '  ', 2
            $member = (Get-FileHash -LiteralPath $parts[1] -Algorithm SHA256).Hash.ToLower()
            if ($member -ne $parts[0]) { throw "Internal checksum mismatch: $($parts[1])" }
          }
          Pop-Location
      - name: Retain release candidate for review only
        uses: actions/upload-artifact@v7
        with:
          name: corpus-verifier-windows-rc-not-for-release
          path: dist/HMS-Corpus-Verifier-v0.1.0-rc.1-Windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 7

  qualify-endeavour-lite-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pinned Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned build environment
        run: python -m pip install --requirement requirements-build.txt
      - name: Build twice and compare within the pinned runner
        shell: pwsh
        run: |
          python scripts/build_endeavour_lite_windows.py
          $zip = 'dist/HMS-Endeavour-Lite-v0.1.0-dev-Windows-x64-portable.zip'
          $first = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          python scripts/build_endeavour_lite_windows.py
          $second = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          if ($first -ne $second) { throw "Two clean runner builds disagreed: $first != $second" }
          "CI package SHA256: $second"
      - name: Qualify exact packaged workstation
        shell: pwsh
        run: |
          $zip = Resolve-Path 'dist/HMS-Endeavour-Lite-v0.1.0-dev-Windows-x64-portable.zip'
          $qual = Join-Path $env:RUNNER_TEMP 'endeavour-lite-qualification'
          $project = Join-Path $env:RUNNER_TEMP 'endeavour-lite-project'
          $export = Join-Path $env:RUNNER_TEMP 'endeavour-lite-export.json'
          Expand-Archive -LiteralPath $zip -DestinationPath $qual
          Push-Location $qual
          Get-Content SHA256SUMS | ForEach-Object {
            $parts = $_ -split '  ', 2
            $member = (Get-FileHash -LiteralPath $parts[1] -Algorithm SHA256).Hash.ToLower()
            if ($member -ne $parts[0]) { throw "Internal checksum mismatch: $($parts[1])" }
          }
          Pop-Location
          & (Join-Path $qual 'HMS-Endeavour-Lite-CLI.exe') self-test
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI self-test failed' }
          $gui = Start-Process -FilePath (Join-Path $qual 'HMS-Endeavour-Lite.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($gui.ExitCode -ne 0) { throw 'Packaged GUI self-test failed' }
          & (Join-Path $qual 'HMS-Endeavour-Lite-CLI.exe') create $project --name 'CI Qualification'
          if ($LASTEXITCODE -ne 0) { throw 'Packaged project creation failed' }
          & (Join-Path $qual 'HMS-Endeavour-Lite-CLI.exe') gp29 $project DIVINITY
          if ($LASTEXITCODE -ne 0) { throw 'Packaged GP29 workflow failed' }
          & (Join-Path $qual 'HMS-Endeavour-Lite-CLI.exe') experiment $project --variant A --variant B --variant AB --hypothesis 'One declared variant has GP sum 61.' --target 61
          if ($LASTEXITCODE -ne 0) { throw 'Packaged bounded experiment failed' }
          $results = & (Join-Path $qual 'HMS-Endeavour-Lite-CLI.exe') list $project | ConvertFrom-Json
          if ($results.Count -ne 2) { throw 'Packaged history did not contain both Results' }
          & (Join-Path $qual 'HMS-Endeavour-Lite-CLI.exe') export $project $results[0].result_id $export
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $export)) { throw 'Packaged Result export failed' }
          $canonical = Get-Content (Join-Path $qual 'canonical/LP-75-IMAGES-v1.0.0.json') | ConvertFrom-Json
          if ($canonical.files.Count -ne 75) { throw 'Bundled canonical corpus identity is wrong' }
          $manifest = Get-Content (Join-Path $qual 'manifest.json') | ConvertFrom-Json
          if ($manifest.package_state -ne 'DEVELOPMENT_NOT_FOR_RELEASE' -or $manifest.network_access -ne $false -or $manifest.telemetry -ne $false -or $manifest.expedition_campaign -ne 'CLOSED') { throw 'Development boundary is wrong' }
      - name: Retain development package for review only
        uses: actions/upload-artifact@v7
        with:
          name: endeavour-lite-windows-development-not-for-release
          path: dist/HMS-Endeavour-Lite-v0.1.0-dev-Windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 7

  qualify-expedition-verifier-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pinned Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned build environment
        run: python -m pip install --requirement requirements-build.txt
      - name: Build twice and compare within the pinned runner
        shell: pwsh
        run: |
          python scripts/build_expedition_verifier_windows.py
          $zip = 'dist/HMS-XPD-0001-v0.3.0-Windows-x64-portable.zip'
          $first = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          python scripts/build_expedition_verifier_windows.py
          $second = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          if ($first -ne $second) { throw "Two clean runner builds disagreed: $first != $second" }
          "CI package SHA256: $second"
      - name: Qualify customer interfaces without exposing the sealed answer
        shell: pwsh
        run: |
          $zip = Resolve-Path 'dist/HMS-XPD-0001-v0.3.0-Windows-x64-portable.zip'
          $qual = Join-Path $env:RUNNER_TEMP 'expedition-verifier-qualification'
          Expand-Archive -LiteralPath $zip -DestinationPath $qual
          & (Join-Path $qual 'HMS-XPD-0001-Verifier-CLI.exe') --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI self-test failed' }
          & (Join-Path $qual 'HMS-XPD-0001-Verifier-CLI.exe') --instructions | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Packaged instructions failed' }
          & (Join-Path $qual 'HMS-XPD-0001-Verifier-CLI.exe') --hint 1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Packaged hint failed' }
          $closedOutput = Join-Path $env:RUNNER_TEMP 'expedition-closed-output.txt'
          $closedError = Join-Path $env:RUNNER_TEMP 'expedition-closed-error.txt'
          $closed = Start-Process -FilePath (Join-Path $qual 'HMS-XPD-0001-Verifier-CLI.exe') -ArgumentList '--json', 'deliberate-nonmatch' -RedirectStandardOutput $closedOutput -RedirectStandardError $closedError -Wait -PassThru
          if ($closed.ExitCode -ne 2 -or (Get-Content $closedError -Raw) -notmatch 'campaign remains closed') { throw 'Unconfigured client did not fail closed' }
          $gui = Start-Process -FilePath (Join-Path $qual 'HMS-XPD-0001-Verifier.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($gui.ExitCode -ne 0) { throw 'Packaged GUI self-test failed' }
          $manifest = Get-Content (Join-Path $qual 'manifest.json') | ConvertFrom-Json
          if ($manifest.status -ne 'IN_DEVELOPMENT' -or $manifest.package_state -ne 'SECURE_SERVICE_CANDIDATE_NOT_FOR_RELEASE' -or $manifest.campaign_state -ne 'CLOSED' -or $manifest.solution_disclosed -ne $false -or $manifest.verification_endpoint_configured -ne $false -or $manifest.verification_public_key_configured -ne $false) { throw 'Package boundary is not closed, non-disclosing, and development-only' }
          Push-Location $qual
          Get-Content SHA256SUMS | ForEach-Object {
            $parts = $_ -split '  ', 2
            $member = (Get-FileHash -LiteralPath $parts[1] -Algorithm SHA256).Hash.ToLower()
            if ($member -ne $parts[0]) { throw "Internal checksum mismatch: $($parts[1])" }
          }
          Pop-Location
      - name: Retain candidate for review only
        uses: actions/upload-artifact@v7
        with:
          name: expedition-verifier-windows-candidate-not-for-release
          path: dist/HMS-XPD-0001-v0.3.0-Windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 7
