name: Validate public records

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch preserved release-candidate commits
        run: git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pull/*/head'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate records, releases, posts, and challenges
        run: python scripts/validate_records.py
      - name: Regenerate and verify the Research Archive
        run: |
          python scripts/build_research_archive.py
          git diff --exit-code
      - name: Verify historical OpenPGP artifact
        run: python scripts/verify_cicada_key.py
      - name: Test challenge verifier core
        run: python -m unittest discover -s tests -v
      - name: Test Expedition beginner guidance
        run: python tests/expedition_guidance_checks.py -v
      - name: Reproduce RSET-0002 public ledgers
        run: python scripts/reproduce_rset_0002.py
      - name: Reject local-only public references
        run: python scripts/check_public_boundary.py

  qualify-gp29-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch preserved release-candidate commits
        run: git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pull/*/head'
      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned build environment
        run: python -m pip install --requirement requirements-build.txt
      - name: Build Windows portable candidate
        run: python scripts/build_gp29_windows.py
      - name: Qualify exact packaged executables and checksums
        shell: pwsh
        run: |
          $manifest = Get-Content releases/manifests/GP29-v0.1.0-rc.1.json | ConvertFrom-Json
          $artifact = $manifest.artifacts | Where-Object name -eq 'HMS-GP29-v0.1.0-rc.1-Windows-x64-portable.zip'
          $zip = Resolve-Path "dist/$($artifact.name)"
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $artifact.sha256) { throw "Package hash mismatch: $actual" }
          $qual = Join-Path $env:RUNNER_TEMP 'gp29-qualification'
          Expand-Archive -LiteralPath $zip -DestinationPath $qual
          & (Join-Path $qual 'HMS-GP29-CLI.exe') self-test
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI self-test failed' }
          & (Join-Path $qual 'HMS-GP29-CLI.exe') gp29 'F U/V TH' --mode tokens --job
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Runtime job failed' }
          $gui = Start-Process -FilePath (Join-Path $qual 'HMS-GP29.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($gui.ExitCode -ne 0) { throw 'Packaged GUI self-test failed' }
          Push-Location $qual
          Get-Content SHA256SUMS | ForEach-Object {
            $parts = $_ -split '  ', 2
            $member = (Get-FileHash -LiteralPath $parts[1] -Algorithm SHA256).Hash.ToLower()
            if ($member -ne $parts[0]) { throw "Internal checksum mismatch: $($parts[1])" }
          }
          Pop-Location
      - name: Retain candidate for review only
        uses: actions/upload-artifact@v4
        with:
          name: HMS-GP29-v0.1.0-rc.1-Windows-x64-portable
          path: dist/HMS-GP29-v0.1.0-rc.1-Windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 7
